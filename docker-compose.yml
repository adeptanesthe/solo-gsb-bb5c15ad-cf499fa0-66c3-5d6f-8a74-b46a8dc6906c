services:
  digest-service:
    build: .
    image: circular-dna-digest:latest
    container_name: circular-dna-digest
    ports:
      - "${PORT:-8000}:8000"
    environment:
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
